name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: npx @vscode/vsce package

      # Publish to Open VSX Registry (Trusted Publishing via OIDC or fallback PAT)
      - name: Publish to Open VSX Registry
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -n "$OPEN_VSX_TOKEN" ]; then
            npx ovsx publish *.vsix --pat "$OPEN_VSX_TOKEN"
          else
            npx ovsx publish *.vsix
          fi

      # Publish to VS Code Marketplace (official) - only if VSCE_PAT is set
      - name: Publish to VS Code Marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish -p "$VSCE_PAT"
          else
            echo "VSCE_PAT is not set. Skipping VS Code Marketplace publish."
          fi

      # Create GitHub Release with the .vsix artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
