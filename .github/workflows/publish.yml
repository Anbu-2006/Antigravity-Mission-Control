name: Publish Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: OPEN_VSX_TOKEN
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Package Extension
        run: npx @vscode/vsce package

      # Publish to Open VSX Registry (Trusted Publishing via OIDC or fallback PAT)
      - name: Publish to Open VSX Registry
        continue-on-error: true
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          PAT_TOKEN="${OPEN_VSX_TOKEN:-${OVSX_PAT:-$OPENVSX_TOKEN}}"
          if [ -n "$PAT_TOKEN" ]; then
            echo "Publishing to Open VSX with Personal Access Token..."
            npx ovsx publish *.vsix --pat "$PAT_TOKEN"
          else
            echo "Publishing to Open VSX using Trusted Publishing (OIDC)..."
            npx ovsx publish *.vsix --trusted-publishing || npx ovsx publish *.vsix || echo "Open VSX publish finished with status $?"
          fi

      # Publish to VS Code Marketplace (official) - only if VSCE_PAT is set
      - name: Publish to VS Code Marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish -p "$VSCE_PAT"
          else
            echo "VSCE_PAT is not set. Skipping VS Code Marketplace publish."
          fi

      # Create GitHub Release with the .vsix artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "Release v1.2.1: Pro Model Telemetry & OAuth Architecture"
          files: "*.vsix"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
