name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: npx @vscode/vsce package

      # Publish to Open VSX Registry (supports OIDC Trusted Publishing & PAT fallback)
      - name: Publish to Open VSX Registry
        run: |
          if [ -n "${{ secrets.OPEN_VSX_TOKEN }}" ]; then
            npx --yes ovsx publish *.vsix --pat ${{ secrets.OPEN_VSX_TOKEN }}
          else
            npx --yes ovsx publish *.vsix
          fi

      # Publish to VS Code Marketplace (official) - only if VSCE_PAT configured
      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        continue-on-error: true
        run: npx @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Create GitHub Release with the .vsix artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
